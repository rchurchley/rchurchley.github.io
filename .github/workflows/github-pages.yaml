name: Deploy Astro site to Pages

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: rchurchley/rosschurchley.com
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Astro
        uses: withastro/action@v6
        with:
          package-manager: bun
          cache: true
          out-dir: out

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
